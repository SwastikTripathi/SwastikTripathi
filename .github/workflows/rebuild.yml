name: Rebuild profile

# Every 6 hours the README and its SVGs are rebuilt from the GitHub API.
# Opening an issue titled "✨ Leave a star" adds the opener to the visitors' constellation at once. A note in
# the issue body shows only after Swastik adds the "approved" label to that issue.
on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["build/**", ".github/workflows/**", "data/theme.txt", "data/my-repos.txt"]
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write

concurrency:
  group: rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    if: >-
      github.event_name != 'issues' ||
      (startsWith(github.event.issue.title, '✨') &&
       (github.event.action == 'opened' || github.event.label.name == 'approved'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild
        id: build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTION: ${{ github.event.action }}
          LOGIN: ${{ github.event.issue.user.login }}
          STAR_MESSAGE: ${{ github.event.issue.body }}
        run: |
          result=""
          if [ "$ACTION" = "opened" ]; then
            result=$(python3 build/build.py --add-star "$LOGIN" | tail -1)
          elif [ "$ACTION" = "labeled" ]; then
            result=$(python3 build/build.py --approve "$LOGIN" | tail -1)
          else
            python3 build/build.py
          fi
          echo "result=$result" >> "$GITHUB_OUTPUT"

      - name: Commit
        env:
          COMMIT_MSG: ${{ github.event_name == 'issues' && format('Sky: {0} ({1})', github.event.issue.user.login, github.event.action) || 'Rebuild profile' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "$COMMIT_MSG"
            git pull --rebase --quiet origin main
            git push
          fi

      - name: Reply to the visitor
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.issue.number }}
          LOGIN: ${{ github.event.issue.user.login }}
          RESULT: ${{ steps.build.outputs.result }}
        run: |
          gh label create approved -R "$GITHUB_REPOSITORY" --color C9A45C --description "Show this visitor's note in the sky" 2>/dev/null || true
          case "$RESULT" in
            added-with-note)   msg="Thanks @$LOGIN, your star is in the sky now ✨ Your note will show up next to it once Swastik has read it." ;;
            added)             msg="Thanks @$LOGIN, your star is in the sky now ✨ (GitHub's image cache can take a few minutes to catch up.)" ;;
            already-there*)    msg="Your star is already up there, @$LOGIN ✨ One per visitor." ;;
            approved)          msg="Your note is in the sky now, @$LOGIN ✨" ;;
            *)                 exit 0 ;;
          esac
          gh issue comment "$NUMBER" -R "$GITHUB_REPOSITORY" --body "$msg"
          gh issue close "$NUMBER" -R "$GITHUB_REPOSITORY" 2>/dev/null || true
